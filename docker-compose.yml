x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow
    VIDEO_DROP_DIR: /videos
    DATA_DIR: /opt/airflow/data
    HOST_DATA_DIR: ${PWD}/data
    HOST_VIDEO_DIR: ${PWD}/videos
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
    OPENROUTER_FINGERPRINT_MODEL: ${OPENROUTER_FINGERPRINT_MODEL:-google/gemini-3.5-flash}
    WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
    YOLO_ONNX_URL: ${YOLO_ONNX_URL:-https://huggingface.co/Kalray/yolov8/resolve/main/yolov8n.onnx}
    DEFINITIONS_PATH: /opt/airflow/definitions.yaml
    DEFINITIONS_LEARNED_PATH: /opt/airflow/data/definitions_learned.yaml
    CLIP_SECONDS: ${CLIP_SECONDS:-180}
    CLIP_OVERLAP_SECONDS: ${CLIP_OVERLAP_SECONDS:-10}
    SPARK_PARALLELISM: ${SPARK_PARALLELISM:-4}
    SPARK_CORES_MAX: ${SPARK_CORES_MAX:-4}
    SPARK_TASK_CPUS: "1"
    SUMMARY_CONCURRENCY: ${SUMMARY_CONCURRENCY:-2}
    SPARK_MASTER: spark://spark-master:7077
    SPARK_DRIVER_HOST: airflow-scheduler
    SPARK_DRIVER_PORT: "7078"
    SPARK_BLOCK_PORT: "7079"
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-512m}
    SPARK_EXECUTOR_MEMORY_OVERHEAD: ${SPARK_EXECUTOR_MEMORY_OVERHEAD:-512m}
    SPARK_EXECUTOR_CORES: "1"
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "3600"
    JAVA_HOME: /usr/lib/jvm/java-17
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./workers:/opt/airflow/workers
    - ./videos:/videos
    - ./data:/opt/airflow/data
    - ./definitions.yaml:/opt/airflow/definitions.yaml
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    spark-master:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_advertised__address: localhost:7687
      NEO4J_server_http_advertised__address: localhost:7474
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      spark-worker:
        condition: service_started

  spark-master:
    build: .
    user: "0:0"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      [
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080",
      ]
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./workers:/opt/airflow/workers
      - ./data:/opt/airflow/data
      - ./videos:/videos
      - ./definitions.yaml:/opt/airflow/definitions.yaml
    restart: always

  spark-worker:
    build: .
    user: "0:0"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      [
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "-c",
        "${SPARK_WORKER_CORES:-4}",
        "-m",
        "${SPARK_WORKER_MEMORY:-4096M}",
      ]
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4096M}
      PYTHONPATH: /opt/airflow
      DATA_DIR: /opt/airflow/data
      HF_HOME: /opt/airflow/data/models/huggingface
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
      YOLO_ONNX_URL: ${YOLO_ONNX_URL:-https://huggingface.co/Kalray/yolov8/resolve/main/yolov8n.onnx}
      CLIP_SECONDS: ${CLIP_SECONDS:-180}
      CLIP_OVERLAP_SECONDS: ${CLIP_OVERLAP_SECONDS:-10}
    volumes:
      - ./workers:/opt/airflow/workers
      - ./data:/opt/airflow/data
      - ./videos:/videos
      - ./definitions.yaml:/opt/airflow/definitions.yaml
    depends_on:
      - spark-master
    restart: always

volumes:
  postgres-db-volume:
  neo4j-data:
